name: Capture
options:
  bundleIdPrefix: dev.crmitchelmore.capture
  deploymentTarget:
    iOS: "15.0"
    macOS: "12.0"
  createIntermediateGroups: true

packages:
  CaptureCore:
    path: ../CaptureCore
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  CaptureiOS:
    type: application
    platform: iOS
    sources:
      - CaptureiOS/Sources
      - CaptureiOS/Assets.xcassets
    dependencies:
      - package: CaptureCore
        product: CaptureCore
      - target: CaptureShare
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.crmitchelmore.capture.ios
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: CaptureiOS/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: CaptureiOS/Capture.entitlements
    info:
      path: CaptureiOS/Info.plist
      properties:
        CFBundleDisplayName: Capture
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true

  CaptureShare:
    type: app-extension
    platform: iOS
    sources:
      - CaptureShare
    dependencies:
      - package: CaptureCore
        product: CaptureCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.crmitchelmore.capture.ios.share
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: CaptureShare/Info.plist
        CODE_SIGN_ENTITLEMENTS: CaptureShare/CaptureShare.entitlements

  CaptureMac:
    type: application
    platform: macOS
    sources:
      - CaptureMac/Sources
      - CaptureMac/Assets.xcassets
    dependencies:
      - package: CaptureCore
        product: CaptureCore
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.crmitchelmore.capture.mac
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: CaptureMac/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
    info:
      path: CaptureMac/Info.plist
      properties:
        CFBundleDisplayName: Capture
        LSMinimumSystemVersion: "12.0"
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        SUEnableAutomaticChecks: true
        SUFeedURL: https://github.com/crmitchelmore/todo/releases/latest/download/appcast.xml
        SUPublicEDKey: HRZfphOJCk8UJTLcguwmJ+BL0ynRJGkiVAZpnsrk1RU=
        SUScheduledCheckInterval: 86400
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
