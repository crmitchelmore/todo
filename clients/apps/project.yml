name: Capture
options:
  bundleIdPrefix: dev.crmitchelmore.capture
  deploymentTarget:
    iOS: "16.0"
    macOS: "12.0"
  createIntermediateGroups: true

packages:
  CaptureCore:
    path: ../CaptureCore
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  CaptureiOS:
    type: application
    platform: iOS
    sources:
      - CaptureiOS/Sources
      - CaptureiOS/Assets.xcassets
    dependencies:
      - package: CaptureCore
        product: CaptureCore
      - target: CaptureShare
        embed: true
      - target: CaptureWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.crmitchelmore.capture.ios
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: CaptureiOS/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: CaptureiOS/Capture.entitlements
    info:
      path: CaptureiOS/Info.plist
      properties:
        CFBundleDisplayName: Capture
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: dev.crmitchelmore.capture.quick-capture
            CFBundleURLSchemes:
              - capture
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CAPTURE_API_SECRET: $(CAPTURE_API_SECRET)
        CAPTURE_KEYCHAIN_ACCESS_GROUP: $(AppIdentifierPrefix)dev.crmitchelmore.capture.session
        NSCalendarsUsageDescription: Capture reads your calendar availability to suggest realistic due dates and show whether you have time for a task.
        NSCalendarsFullAccessUsageDescription: Capture reads your calendar availability to suggest realistic due dates and show whether you have time for a task.
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true

  CaptureShare:
    type: app-extension
    platform: iOS
    sources:
      - CaptureShare
    dependencies:
      - package: CaptureCore
        product: CaptureCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.crmitchelmore.capture.ios.share
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: CaptureShare/Info.plist
        CODE_SIGN_ENTITLEMENTS: CaptureShare/CaptureShare.entitlements

  CaptureWidget:
    type: app-extension
    platform: iOS
    sources:
      - CaptureWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.crmitchelmore.capture.ios.widget
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: CaptureWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: CaptureWidget/CaptureWidget.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"

  CaptureMac:
    type: application
    platform: macOS
    sources:
      - CaptureMac/Sources
      - CaptureMac/Assets.xcassets
    dependencies:
      - package: CaptureCore
        product: CaptureCore
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.crmitchelmore.capture.mac
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: CaptureMac/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: CaptureMac/Capture.entitlements
    info:
      path: CaptureMac/Info.plist
      properties:
        CFBundleDisplayName: Capture
        CAPTURE_API_SECRET: $(CAPTURE_API_SECRET)
        NSCalendarsUsageDescription: Capture reads your calendar availability to suggest realistic due dates and show whether you have time for a task.
        NSCalendarsFullAccessUsageDescription: Capture reads your calendar availability to suggest realistic due dates and show whether you have time for a task.
        LSMinimumSystemVersion: "12.0"
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        SUEnableAutomaticChecks: true
        SUFeedURL: https://github.com/crmitchelmore/todo/releases/latest/download/appcast.xml
        SUPublicEDKey: HRZfphOJCk8UJTLcguwmJ+BL0ynRJGkiVAZpnsrk1RU=
        SUScheduledCheckInterval: 86400
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
