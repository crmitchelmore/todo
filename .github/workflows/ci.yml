name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-services:
    name: Node services
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, worker, integrations]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.service }}/package-lock.json
      - run: npm ci
        working-directory: ${{ matrix.service }}
      - run: npm run typecheck
        working-directory: ${{ matrix.service }}
      - run: npm test
        working-directory: ${{ matrix.service }}

  web:
    name: Web
    runs-on: ubuntu-latest
    env:
      VITE_BACKEND_URL: http://127.0.0.1:6060
      VITE_POWERSYNC_URL: http://127.0.0.1:8080
      VITE_GITHUB_OAUTH_PROBE: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Install Playwright Chrome
        working-directory: web
        run: |
          for attempt in 1 2 3; do
            if npx playwright install --with-deps chrome; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          npx playwright install --with-deps chrome
      - run: npm run test:ui
        working-directory: web

  native:
    name: Native Apple clients
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: brew install xcodegen
      - run: swift test
        working-directory: clients/CaptureCore
      - run: xcodegen generate
        working-directory: clients/apps
      - name: Build macOS app
        working-directory: clients/apps
        run: |
          xcodebuild -project Capture.xcodeproj \
            -scheme CaptureMac \
            -destination 'platform=macOS' \
            build CODE_SIGNING_ALLOWED=NO
      - name: Build iOS simulator app
        working-directory: clients/apps
        run: |
          xcodebuild -project Capture.xcodeproj \
            -scheme CaptureiOS \
            -destination 'generic/platform=iOS Simulator' \
            build CODE_SIGNING_ALLOWED=NO
