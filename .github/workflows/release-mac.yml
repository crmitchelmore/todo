name: Release macOS App

# Builds, signs (Developer ID), notarises, and publishes the Capture Mac app,
# then generates a Sparkle appcast.xml so existing installs auto-update.
#
# Required secrets (already set): APP_STORE_CONNECT_API_KEY (base64 .p8),
#   APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID, APPLE_TEAM_ID,
#   SPARKLE_PRIVATE_KEY (EdDSA private key, base64).
# Optional (recommended for reliable Developer ID signing): import an existing
#   Developer ID Application cert via APPLE_DEVELOPER_ID_APPLICATION (base64 .p12)
#   + APPLE_DEVELOPER_ID_APPLICATION_PASSWORD. If absent, the export step relies
#   on -allowProvisioningUpdates to obtain one via the App Store Connect API.
#
# Trigger: push a tag like `mac-v0.1.0`, or run manually (workflow_dispatch).

on:
  push:
    tags:
      - 'mac-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.0)'
        required: false

env:
  SCHEME: CaptureMac
  PRODUCT_NAME: CaptureMac
  PROJECT: clients/apps/Capture.xcodeproj
  BUNDLE_ID: dev.crmitchelmore.capture.mac

jobs:
  build-and-release:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Determine Version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "$GITHUB_REF" == refs/tags/mac-v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/mac-v}"
          else
            VERSION="0.1.0"
          fi
          BUILD_NUMBER=$(date -u +"%Y%m%d%H%M")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION (build $BUILD_NUMBER)"

      - name: Generate Xcode Project
        working-directory: clients/apps
        run: |
          xcodegen generate
          # Stamp marketing + build version into the generated Mac Info.plist.
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ steps.version.outputs.version }}" CaptureMac/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ steps.version.outputs.build }}" CaptureMac/Info.plist || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string ${{ steps.version.outputs.build }}" CaptureMac/Info.plist

      - name: Install App Store Connect API Key
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          umask 077
          mkdir -p ~/.appstoreconnect/private_keys ~/.private_keys
          echo "$APP_STORE_CONNECT_API_KEY" | base64 --decode > ~/.private_keys/AuthKey_${KEY_ID}.p8
          cp ~/.private_keys/AuthKey_${KEY_ID}.p8 ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8

      - name: Require Developer ID Certificate
        env:
          CERT: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
        run: |
          if [ -z "$CERT" ]; then
            echo "::error::Missing secret APPLE_DEVELOPER_ID_APPLICATION (base64 .p12 of a 'Developer ID Application' identity)."
            echo "Developer ID signing + notarization require this certificate; the App Store Connect API key alone cannot create it."
            echo "See docs/mac-release.md for how to export and add it (plus APPLE_DEVELOPER_ID_APPLICATION_PASSWORD)."
            exit 1
          fi

      - name: Import Developer ID Certificate
        env:
          CERT: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          CERT_PATH=$RUNNER_TEMP/cert.p12
          echo -n "$CERT" | base64 --decode -o "$CERT_PATH"
          security import "$CERT_PATH" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"

      - name: Build Release Archive
        run: |
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/$PRODUCT_NAME.xcarchive" \
            -destination "generic/platform=macOS" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_HARDENED_RUNTIME=YES

      - name: Export & Sign (Developer ID)
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>developer-id</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>signingCertificate</key><string>Developer ID Application</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/$PRODUCT_NAME.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            ENABLE_HARDENED_RUNTIME=YES \
            OTHER_CODE_SIGN_FLAGS="--options runtime"

      - name: Verify Signature & Hardened Runtime
        run: |
          APP_PATH="$RUNNER_TEMP/export/$PRODUCT_NAME.app"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign -dv --verbose=4 "$APP_PATH" 2>&1 | tee /tmp/cs.txt
          grep -q "flags=.*runtime" /tmp/cs.txt || { echo "::error::hardened runtime missing on main app"; exit 1; }
          # Sparkle's nested helpers must also be signed with runtime for notarization.
          if [ -d "$APP_PATH/Contents/Frameworks/Sparkle.framework" ]; then
            codesign --verify --strict --verbose=2 "$APP_PATH/Contents/Frameworks/Sparkle.framework"
          fi

      - name: Notarize & Staple
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          APP_PATH="$RUNNER_TEMP/export/$PRODUCT_NAME.app"
          VERSION="${{ steps.version.outputs.version }}"
          ZIP_PATH="$RUNNER_TEMP/Capture-${VERSION}.zip"
          ditto -c -k --keepParent "$APP_PATH" "$ZIP_PATH"
          xcrun notarytool submit "$ZIP_PATH" \
            --key ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8 \
            --key-id "$KEY_ID" \
            --issuer "$ISSUER_ID" \
            --wait
          xcrun stapler staple "$APP_PATH"
          # Re-zip the stapled app for distribution.
          rm -f "$ZIP_PATH"
          ditto -c -k --keepParent "$APP_PATH" "$ZIP_PATH"
          echo "ZIP_PATH=$ZIP_PATH" >> "$GITHUB_ENV"

      - name: Generate Appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          chmod +x scripts/generate-appcast.sh
          scripts/generate-appcast.sh \
            "${{ steps.version.outputs.version }}" \
            "${{ steps.version.outputs.build }}" \
            "$ZIP_PATH" \
            "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/appcast.xml"
          echo "APPCAST_PATH=$RUNNER_TEMP/appcast.xml" >> "$GITHUB_ENV"
          cat "$RUNNER_TEMP/appcast.xml"

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/mac-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ZIP_PATH }}
            ${{ env.APPCAST_PATH }}
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact (manual builds)
        if: "!startsWith(github.ref, 'refs/tags/mac-v')"
        uses: actions/upload-artifact@v4
        with:
          name: Capture-${{ steps.version.outputs.version }}
          path: |
            ${{ env.ZIP_PATH }}
            ${{ env.APPCAST_PATH }}

      - name: Cleanup
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true
          rm -f ~/.appstoreconnect/private_keys/*.p8 ~/.private_keys/*.p8 2>/dev/null || true
