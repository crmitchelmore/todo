name: Validate Web App

on:
  push:
    branches:
      - main
    paths:
      - web/**
      - .github/workflows/release-web.yml
  workflow_dispatch: {}

concurrency:
  group: release-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build production web bundle
    runs-on: ubuntu-latest
    env:
      VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      VITE_SENTRY_ENVIRONMENT: production
      VITE_BACKEND_URL: ${{ vars.VITE_BACKEND_URL }}
      VITE_POWERSYNC_URL: ${{ vars.VITE_POWERSYNC_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Require production endpoints
        run: |
          if [ -z "$VITE_BACKEND_URL" ] || [ -z "$VITE_POWERSYNC_URL" ]; then
            echo "::error::Set VITE_BACKEND_URL and VITE_POWERSYNC_URL repository variables."
            exit 1
          fi

      - name: Build and test
        working-directory: web
        run: |
          npm run typecheck
          npm test
          npm run build
