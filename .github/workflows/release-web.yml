name: Release Web App

on:
  push:
    branches:
      - main
    paths:
      - web/**
      - .github/workflows/release-web.yml
  workflow_dispatch: {}

concurrency:
  group: release-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and deploy web
    runs-on: ubuntu-latest
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN || secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT: production
      VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      VITE_SENTRY_ENVIRONMENT: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build and test
        working-directory: web
        run: |
          npm run typecheck
          npm test
          npm run build

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy web service to Railway
        run: |
          if [ -z "$RAILWAY_API_TOKEN" ]; then
            echo "::error::Set RAILWAY_API_TOKEN (or RAILWAY_TOKEN) to deploy the web app."
            exit 1
          fi
          if [ -z "$RAILWAY_PROJECT_ID" ]; then
            echo "::error::Set RAILWAY_PROJECT_ID to the Railway capture project id."
            exit 1
          fi
          railway up --ci --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT" --service web
