<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Capture app icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#16181C"/>
      <stop offset="1" stop-color="#0A0B0D"/>
    </linearGradient>
    <linearGradient id="velo" x1="240" y1="720" x2="800" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B8FF2E"/>
      <stop offset="0.55" stop-color="#3DF5B0"/>
      <stop offset="1" stop-color="#18E0FF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.62" cy="0.34" r="0.7">
      <stop offset="0" stop-color="#3DF5B0" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#3DF5B0" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <!-- squircle background (system mask will round further) -->
  <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="230" fill="url(#glow)"/>

  <!-- faint engineering grid texture -->
  <g stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="2">
    <path d="M0 256 H1024 M0 512 H1024 M0 768 H1024 M256 0 V1024 M512 0 V1024 M768 0 V1024"/>
  </g>

  <!-- glow under the mark -->
  <path d="M336 524 L464 660 L796 276"
        stroke="url(#velo)" stroke-width="96" stroke-linecap="round" stroke-linejoin="round"
        fill="none" filter="url(#soft)" opacity="0.5"/>

  <!-- motion trails -->
  <g stroke="url(#velo)" stroke-linecap="round" stroke-width="52">
    <line x1="188" y1="560" x2="292" y2="440" opacity="0.95"/>
    <line x1="140" y1="640" x2="224" y2="544" opacity="0.6"/>
    <line x1="104" y1="712" x2="168" y2="640" opacity="0.35"/>
  </g>

  <!-- velocity check -->
  <path d="M336 524 L464 660 L796 276"
        stroke="url(#velo)" stroke-width="96"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
