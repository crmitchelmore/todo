# yaml-language-server: $schema=https://unpkg.com/@powersync/service-schema@latest/json-schema/powersync-config.json
# PowerSync service config for the Capture stack (self-hosted).

telemetry:
  disable_telemetry_sharing: true

replication:
  connections:
    - type: postgresql
      uri: !env PS_DATA_SOURCE_URI
      sslmode: disable # OK for local/private (Tailscale) networks; not for public

storage:
  type: postgresql
  uri: !env PS_STORAGE_URI
  # sslmode is NOT read from the URI query string (powersync ignores it there and
  # defaults to verify-full). Must be set explicitly. Our PG has no TLS on the
  # private network, so disable it here as we do for replication above.
  sslmode: disable

port: !env PS_PORT

sync_config:
  path: sync-config.yaml

client_auth:
  # Allow the locally-hosted backend JWKS endpoint (http) to be used for token verification.
  allow_local_jwks: true
  jwks_uri: !env PS_JWKS_URL
  audience: ["powersync-dev", "powersync"]

api:
  tokens:
    - !env PS_API_TOKEN

system:
  logging:
    level: info
    format: text
