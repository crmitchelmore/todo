# yaml-language-server: $schema=https://unpkg.com/@powersync/service-schema@latest/json-schema/powersync-config.json
# PowerSync service config for the Capture stack (self-hosted).

telemetry:
  disable_telemetry_sharing: true

replication:
  connections:
    - type: postgresql
      uri: !env PS_DATA_SOURCE_URI
      sslmode: disable # OK for local/private (Tailscale) networks; not for public

storage:
  type: mongodb
  uri: !env PS_MONGO_URI

port: !env PS_PORT

sync_config:
  path: sync-config.yaml

client_auth:
  # Allow the locally-hosted backend JWKS endpoint (http) to be used for token verification.
  allow_local_jwks: true
  jwks_uri: !env PS_JWKS_URL
  audience: ["powersync-dev", "powersync"]

api:
  tokens:
    - use_a_better_token_in_production

system:
  logging:
    level: info
    format: text
