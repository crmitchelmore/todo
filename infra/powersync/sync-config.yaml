# yaml-language-server: $schema=https://unpkg.com/@powersync/service-sync-rules@latest/schema/sync_rules.json
# Sync rules for the Capture stack.
# Multi-user: each client only syncs the rows it owns. `auth.user_id()` is the JWT `sub`, which
# the backend sets to the user's internal id (== owner_id) when minting the per-user sync token.
#
# Changes here require a PowerSync service restart to take effect.

config:
  edition: 3

streams:
  tasks:
    auto_subscribe: true
    queries:
      - SELECT * FROM tasks WHERE owner_id = auth.user_id()
  tags:
    auto_subscribe: true
    queries:
      - SELECT * FROM tags WHERE owner_id = auth.user_id()
  task_events:
    auto_subscribe: true
    queries:
      - SELECT * FROM task_events WHERE owner_id = auth.user_id()
  task_attachments:
    auto_subscribe: true
    queries:
      - SELECT * FROM task_attachments WHERE owner_id = auth.user_id()
  agent_proposals:
    auto_subscribe: true
    queries:
      - SELECT * FROM agent_proposals WHERE owner_id = auth.user_id()
